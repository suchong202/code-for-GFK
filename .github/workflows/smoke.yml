name: public-preview-smoke-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Train public placeholder demo
        run: python train.py --config configs/demo.yaml --seed 42
      - name: Evaluate public placeholder demo
        run: python evaluate.py --config configs/demo.yaml --seed 42
      - name: Run tests
        run: python -m unittest discover -s tests -v
